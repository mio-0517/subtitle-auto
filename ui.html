<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字幕メーカー</title>
<style>
  :root{
    --bg:#0e1013; --card:#171a20; --card2:#1d2129; --line:#262b35;
    --tx:#e9ecf1; --sub:#8b929e; --dim:#5f6672;
    --accent:#7c5cff; --accent2:#9d85ff; --ok:#35c77a; --ng:#ff5f5f; --warn:#ffb020;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--tx);
    font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto;padding:24px 18px 80px}

  header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  h1{font-size:19px;margin:0;letter-spacing:.02em;font-weight:600}
  .live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(53,199,122,.6);animation:pulse 2.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,199,122,.5)}70%{box-shadow:0 0 0 7px rgba(53,199,122,0)}100%{box-shadow:0 0 0 0 rgba(53,199,122,0)}}
  .dot.off{background:var(--ng);animation:none}

  #drop{
    border:1.5px dashed #333947; border-radius:14px; padding:30px 20px; text-align:center;
    background:linear-gradient(180deg,#15181e,#131620); cursor:pointer;
    transition:.18s; margin-bottom:22px;
  }
  #drop:hover{border-color:#48506a;background:#171b23}
  #drop.over{border-color:var(--accent);background:rgba(124,92,255,.09)}
  #drop .big{font-size:15px;font-weight:600;margin-bottom:6px}
  #drop .small{font-size:12.5px;color:var(--sub);line-height:1.6}
  .plus{font-size:26px;color:var(--accent2);margin-bottom:8px;line-height:1}

  .urlrow{display:flex;gap:8px;margin:-8px 0 20px}
  .urlrow input{
    flex:1;min-width:0;font:inherit;font-size:13px;padding:10px 13px;border-radius:9px;
    background:#14171d;border:1px solid var(--line);color:var(--tx);outline:none;
  }
  .urlrow input:focus{border-color:var(--accent)}
  .urlrow input::placeholder{color:var(--dim)}
  .urlrow .btn{white-space:nowrap;padding:0 16px}
  #urlerr{margin:-12px 0 18px;white-space:pre-line}
  .sec{font-size:11.5px;color:var(--dim);letter-spacing:.08em;margin:0 0 10px 2px;font-weight:600}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:10px; overflow:hidden;
  }
  .row{display:flex;gap:13px;padding:12px}
  .thumb{
    width:132px;min-width:132px;height:74px;border-radius:8px;background:#0a0c10;
    object-fit:cover;display:block;border:1px solid #222732;
  }
  .thumb.ph{display:flex;align-items:center;justify-content:center;color:#39404e;font-size:22px}
  .meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:7px}
  .name{
    font-size:14px;font-weight:600;line-height:1.35;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;
  }
  .line2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--sub)}

  .badge{
    font-size:11px;font-weight:600;padding:2.5px 8px;border-radius:20px;
    border:1px solid transparent;white-space:nowrap;
  }
  .b-run{background:rgba(124,92,255,.16);color:var(--accent2);border-color:rgba(124,92,255,.3)}
  .b-wait{background:rgba(255,176,32,.13);color:var(--warn);border-color:rgba(255,176,32,.28)}
  .b-done{background:rgba(53,199,122,.14);color:var(--ok);border-color:rgba(53,199,122,.3)}
  .b-fail{background:rgba(255,95,95,.14);color:var(--ng);border-color:rgba(255,95,95,.3)}

  .bar{height:4px;background:#232833;border-radius:4px;overflow:hidden}
  .bar > i{
    display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
    border-radius:4px;transition:width .5s ease;
  }
  .bar.indet > i{
    width:38% !important;
    background:linear-gradient(90deg,transparent,var(--accent2),transparent);
    animation:slide 1.5s infinite ease-in-out;
  }
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}

  .acts{display:flex;gap:7px;padding:0 12px 12px 157px;flex-wrap:wrap}
  .btn{
    font:inherit;font-size:12px;font-weight:600;padding:6px 13px;border-radius:7px;
    border:1px solid var(--line);background:var(--card2);color:var(--tx);cursor:pointer;
  }
  .btn:hover{background:#252b36;border-color:#39404e}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent2)}
  .player{padding:0 12px 12px}
  .player video{width:100%;border-radius:9px;background:#000;display:block}
  .wait{margin:0 12px 12px;padding:9px 11px;background:rgba(255,176,32,.08);
    border:1px solid rgba(255,176,32,.22);border-radius:8px;
    font-size:12px;color:#ffd693;line-height:1.6}
  .err{
    margin:0 12px 12px;padding:9px 11px;background:rgba(255,95,95,.08);
    border:1px solid rgba(255,95,95,.22);border-radius:8px;
    font-size:11.5px;color:#ffa9a9;line-height:1.55;word-break:break-all;
  }
  .empty{text-align:center;color:var(--dim);font-size:13px;padding:34px 0;line-height:1.8}
  .hint{font-size:11.5px;color:var(--dim);margin-top:16px;line-height:1.7;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>字幕メーカー</h1>
    <div class="live"><span class="dot" id="dot"></span><span id="livetx">稼働中</span></div>
  </header>

  <div id="drop">
    <div class="plus">＋</div>
    <div class="big">英語の動画をここにドロップ</div>
    <div class="small">クリックして選ぶこともできます／mp4・mov・mkv・音声ファイルもOK</div>
  </div>
  <input type="file" id="file" multiple accept="video/*,audio/*" style="display:none">

  <div class="urlrow">
    <input id="url" type="url" spellcheck="false"
           placeholder="動画のURLを貼る（Google Drive・Dropbox・.mp4 の直リンク）">
    <button class="btn primary" id="go">取り込む</button>
  </div>
  <div id="urlerr" class="err" hidden></div>

  <div class="sec">処理中・完了した動画</div>
  <div id="list"><div class="empty">まだ何もありません<br>上に動画を入れると自動で始まります</div></div>

  <div class="hint">初回は英語を聞き取るAIの準備で時間がかかります（20〜40分）。2本目からは速いです。</div>
</div>

<script>
const $ = s => document.querySelector(s);
const list = $('#list'), drop = $('#drop'), fileIn = $('#file');
let uploads = {};   // アップロード中のみ画面に出す一時データ
let openPlayers = new Set();

const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mb = b => !b ? '' : (b >= 1073741824 ? (b/1073741824).toFixed(1)+' GB' : Math.round(b/1048576)+' MB');
const mmss = s => { if(!s) return ''; s=Math.round(s); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); };

const BADGE = {
  queued:['b-wait','順番待ち'], extracting:['b-run','準備中'], transcribing:['b-run','聞き取り中'],
  translating:['b-run','翻訳中'], muxing:['b-run','仕上げ中'], done:['b-done','完了'], failed:['b-fail','失敗'],
  awaiting:['b-wait','翻訳待ち'], downloading:['b-run','取り込み中']
};

function card(j){
  const [cls,label] = BADGE[j.status] || ['b-run', j.status||''];
  const running = !['done','failed','awaiting'].includes(j.status);
  const indetDl = j.status === 'downloading' && !j.size;
  const indet = j.status === 'transcribing';
  const pct = Math.round((j.ratio||0)*100);
  const bits = [mmss(j.duration), mb(j.size), j.took_min ? j.took_min+'分で完了' : ''].filter(Boolean);

  const thumb = j.hasThumb
    ? `<img class="thumb" src="/api/thumb/${encodeURIComponent(j.id)}.jpg" alt="">`
    : `<div class="thumb ph">▶</div>`;

  let acts = '', player = '', err = '';
  if (j.status === 'awaiting') {
    err = `<div class="wait">英語の聞き取りは完了（${j.lines||'?'}行）。<br>
      Claudeに「訳して」と言うと日本語字幕が入ります。</div>`;
    if (j.srt_en) acts += `<a class="btn" href="/media?name=${encodeURIComponent(j.srt_en)}" download>英語字幕を保存</a>`;
  }
  if (j.status === 'done') {
    const open = openPlayers.has(j.id);
    if (j.output) acts += `<button class="btn primary" data-play="${esc(j.id)}">${open?'閉じる':'▶ 見る'}</button>`;
    if (j.srt_ja) acts += `<a class="btn" href="/media?name=${encodeURIComponent(j.srt_ja)}" download>字幕を保存</a>`;
    if (open && j.output) {
      const vsrc = j.source ? `/media/source?name=${encodeURIComponent(j.source)}`
                            : `/media?name=${encodeURIComponent(j.output)}`;
      player = `<div class="player"><video controls playsinline preload="metadata" src="${vsrc}">
        ${j.srt_ja ? `<track default kind="subtitles" srclang="ja" label="日本語" src="/api/vtt?name=${encodeURIComponent(j.srt_ja)}">` : ''}
        ${j.srt_en ? `<track kind="subtitles" srclang="en" label="English" src="/api/vtt?name=${encodeURIComponent(j.srt_en)}">` : ''}
      </video></div>`;
    }
  }
  if (j.status === 'failed' && j.error) err = `<div class="err">${esc(j.error)}</div>`;

  return `<div class="card">
    <div class="row">${thumb}
      <div class="meta">
        <div class="name">${esc(j.name||'(名前なし)')}</div>
        <div class="line2"><span class="badge ${cls}">${label}</span><span>${esc(j.note||'')}</span></div>
        ${running ? `<div class="bar ${indet?'indet':''}"><i style="width:${pct}%"></i></div>` : ''}
        ${bits.length ? `<div class="line2">${bits.map(esc).join(' ・ ')}</div>` : ''}
      </div>
    </div>
    ${acts ? `<div class="acts">${acts}</div>` : ''}${player}${err}</div>`;
}

function uploadCard(u){
  return `<div class="card"><div class="row"><div class="thumb ph">↑</div>
    <div class="meta"><div class="name">${esc(u.name)}</div>
      <div class="line2"><span class="badge b-wait">送信中</span><span>${u.pct}%</span></div>
      <div class="bar"><i style="width:${u.pct}%"></i></div>
    </div></div></div>`;
}

async function tick(){
  let data;
  try {
    const r = await fetch('/api/jobs', {cache:'no-store'});
    data = await r.json();
    $('#dot').classList.remove('off'); $('#livetx').textContent = '稼働中';
  } catch(e){
    $('#dot').classList.add('off'); $('#livetx').textContent = '停止中';
    return;
  }
  const ups = Object.values(uploads);
  const jobs = data.jobs || [];
  if (!ups.length && !jobs.length){
    list.innerHTML = '<div class="empty">まだ何もありません<br>上に動画を入れると自動で始まります</div>';
    return;
  }
  list.innerHTML = ups.map(uploadCard).join('') + jobs.map(card).join('');
}

// 再生ボタン
list.addEventListener('click', e => {
  const b = e.target.closest('[data-play]');
  if (!b) return;
  const id = b.dataset.play;
  openPlayers.has(id) ? openPlayers.delete(id) : openPlayers.add(id);
  tick();
});

// アップロード
function send(file){
  const key = file.name + ':' + file.size + ':' + Math.random().toString(36).slice(2,7);
  uploads[key] = {name:file.name, pct:0};
  tick();
  const xhr = new XMLHttpRequest();
  xhr.open('PUT', '/api/upload?name=' + encodeURIComponent(file.name));
  xhr.upload.onprogress = e => {
    if (e.lengthComputable){ uploads[key].pct = Math.round(e.loaded/e.total*100); tick(); }
  };
  xhr.onload = () => { delete uploads[key]; setTimeout(tick, 400); };
  xhr.onerror = () => { delete uploads[key]; alert('送信に失敗しました: ' + file.name); tick(); };
  xhr.send(file);
}
const handle = files => [...files].forEach(send);

// URLから取り込む
const urlIn = $('#url'), urlErr = $('#urlerr');
async function fetchUrl(){
  const v = urlIn.value.trim();
  if (!v) return;
  urlErr.hidden = true;
  $('#go').disabled = true;
  try{
    const r = await fetch('/api/fetch', {method:'POST', headers:{'Content-Type':'application/json'},
                                         body: JSON.stringify({url:v})});
    const d = await r.json();
    if (!d.ok){ urlErr.textContent = d.error || '取り込めませんでした'; urlErr.hidden = false; }
    else { urlIn.value = ''; }
  } catch(e){
    urlErr.textContent = '取り込めませんでした: ' + e; urlErr.hidden = false;
  }
  $('#go').disabled = false;
  tick();
}
$('#go').addEventListener('click', fetchUrl);
urlIn.addEventListener('keydown', e => { if (e.key === 'Enter') fetchUrl(); });

drop.addEventListener('click', () => fileIn.click());
fileIn.addEventListener('change', e => { handle(e.target.files); fileIn.value=''; });
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handle(e.dataTransfer.files));
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
